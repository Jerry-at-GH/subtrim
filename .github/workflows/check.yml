name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: stable
          cache: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: select Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: '"CC=$env:MSYS2_LOCATION/ucrt64/bin/gcc.exe" >> $env:GITHUB_ENV'
      - name: build
        shell: bash
        run: |
          binary=subtrim
          if [[ "$RUNNER_OS" == Windows ]]; then binary=subtrim.exe; fi
          go build -trimpath -o "dist/$binary" ./cmd/subtrim
          "./dist/$binary" clean --help
          cp README.md dist/
          echo "ARCHIVE=subtrim-$(go env GOOS)-$(go env GOARCH)" >> "$GITHUB_ENV"
      - name: archive Windows build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "$env:ARCHIVE.zip"
      - name: archive Unix build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && runner.os != 'Windows'
        run: tar -czf "$ARCHIVE.tar.gz" -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: subtrim-${{ matrix.os }}
          path: subtrim-*.*
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: subtrim-*
          merge-multiple: true
          path: dist
      - name: publish commit build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=latest
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          notes="automated build for commit $GITHUB_SHA."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "latest build" --notes "$notes" --prerelease
          else
            gh release create "$tag" dist/* --verify-tag --title "latest build" --prerelease --notes "$notes"
          fi
